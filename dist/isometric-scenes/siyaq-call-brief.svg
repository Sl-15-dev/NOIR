<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="sy-title sy-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="sy-title">Siyaq Case File</title>
<desc id="sy-desc">Separate call, chat, and email records feed an origami-like violet folder. An ivory brief rises from the case, an Arabic customer message appears, and a wax seal marks it saved.</desc>
<style>
  .sy-stream { stroke-dasharray: 9 105; animation: sy-stream 10.2s linear infinite; }
  .sy-stream-chat { animation-delay: .53s; }
  .sy-stream-email { animation-delay: 1.03s; }
  .sy-source-lamp { animation: sy-source-lamp 10.2s ease-in-out infinite; }
  .sy-chat-lamp { animation-delay: .53s; }
  .sy-email-lamp { animation-delay: 1.03s; }
  .sy-brief-rise { animation: sy-brief-rise 10.2s cubic-bezier(.36,.02,.24,1) infinite; }
  .sy-brief-check { animation: sy-brief-check 10.2s ease-in-out infinite; }
  .sy-answer-write { animation: sy-answer-write 10.2s ease-in-out infinite; }
  .sy-seal-impress { animation: sy-seal-impress 10.2s cubic-bezier(.17,.65,.33,1) infinite; }
  .sy-seal-glow { animation: sy-seal-glow 10.2s ease-in-out infinite; }
  @keyframes sy-stream {
    0%,6% { opacity:0; stroke-dashoffset:11; }
    8% { opacity:1; stroke-dashoffset:11; }
    30% { opacity:1; stroke-dashoffset:-101; }
    35%,100% { opacity:0; stroke-dashoffset:-115; }
  }
  @keyframes sy-source-lamp { 0%,5%,35%,100% { opacity:.3; } 11%,21% { opacity:1; } }
  @keyframes sy-brief-rise {
    0%,26%,97%,100% { transform:translate(-9px,37px); }
    46%,86% { transform:translate(0,0); }
  }
  @keyframes sy-brief-check { 0%,37%,95%,100% { opacity:.26; } 51%,86% { opacity:1; } }
  @keyframes sy-answer-write {
    0%,46%,98%,100% { opacity:.32; transform:translate(-8px,7px); }
    59%,92% { opacity:1; transform:translate(0,0); }
  }
  @keyframes sy-seal-impress {
    0%,60%,100% { opacity:.45; transform:translate(0,-8px); }
    70%,91% { opacity:1; transform:translate(0,0); }
  }
  @keyframes sy-seal-glow { 0%,61%,84%,100% { opacity:0; } 70% { opacity:.65; } }
  @media (prefers-reduced-motion: reduce) {
    .sy-stream,.sy-source-lamp,.sy-brief-rise,.sy-brief-check,.sy-answer-write,.sy-seal-impress,.sy-seal-glow { animation:none; }
  }
</style>
<defs>
  <linearGradient id="sy-outer" x2=".97" y2=".85"><stop stop-color="#6851ad"/><stop offset=".57" stop-color="#3a2b6f"/><stop offset="1" stop-color="#251b53"/></linearGradient>
  <linearGradient id="sy-cover" x2=".87" y2="1"><stop stop-color="#30245d"/><stop offset=".52" stop-color="#544087"/><stop offset="1" stop-color="#271c52"/></linearGradient>
  <linearGradient id="sy-pocket" x2=".65" y2="1"><stop stop-color="#534080"/><stop offset=".58" stop-color="#34265d"/><stop offset="1" stop-color="#231944"/></linearGradient>
  <linearGradient id="sy-gusset" x2=".82" y2="1"><stop stop-color="#4d377e"/><stop offset=".58" stop-color="#2b204b"/><stop offset="1" stop-color="#201730"/></linearGradient>
  <linearGradient id="sy-ivory" x2=".92" y2="1"><stop stop-color="#fff9ec"/><stop offset=".57" stop-color="#f9efe0"/><stop offset="1" stop-color="#e2d5c7"/></linearGradient>
  <linearGradient id="sy-paper-edge" x2=".5" y2="1"><stop stop-color="#ddd0c7"/><stop offset="1" stop-color="#ae9ab5"/></linearGradient>
  <linearGradient id="sy-lilac" x2=".92" y2="1" data-paint-policy="accent"><stop stop-color="#e6d9ff"/><stop offset=".48" stop-color="#c5a8ff"/><stop offset="1" stop-color="#a375fa"/></linearGradient>
  <linearGradient id="sy-saturated" x2=".8" y2="1" data-paint-policy="accent"><stop stop-color="#c3a5ff"/><stop offset=".57" stop-color="#8c59ed"/><stop offset="1" stop-color="#653bc7"/></linearGradient>
  <linearGradient id="sy-mulberry" x2=".7" y2="1" data-paint-policy="accent"><stop stop-color="#975ef4"/><stop offset=".5" stop-color="#7045cd"/><stop offset="1" stop-color="#4c299f"/></linearGradient>
  <linearGradient id="sy-foil" x2=".95" y2=".86" data-paint-policy="accent"><stop stop-color="#f7eafa"/><stop offset=".28" stop-color="#d9baff"/><stop offset=".49" stop-color="#a16df4"/><stop offset=".66" stop-color="#dfbdff"/><stop offset="1" stop-color="#885ae5"/></linearGradient>
  <filter id="sy-ground" x="-24%" y="-40%" width="150%" height="198%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="sy-contact" x="-28%" y="-45%" width="157%" height="198%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="sy-glow" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4"/></filter>
